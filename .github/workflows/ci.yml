name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medical_notes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medical_notes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medical_notes_test
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and PostgreSQL integration tests
        run: npm test

      - name: Validate content
        run: npm run content:check

      - name: Build static site
        run: npm run build

      - name: Run browser tests
        run: npm run test:e2e
